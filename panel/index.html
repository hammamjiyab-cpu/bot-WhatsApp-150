<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hammam Bot</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
:root{--g:linear-gradient(90deg,#ff3cac,#a855f7,#22d3ee);--ok:#22c55e;--no:#f43f5e;--t:#f5f3ff;--m:#b6a9d9}
*{box-sizing:border-box}html{background:#12062b}
body{margin:0;min-height:100vh;color:var(--t);font:15px system-ui,sans-serif;padding:18px 14px 40px;background:radial-gradient(circle at 15% 0,#7c1fa8aa,transparent 45%),radial-gradient(circle at 90% 20%,#0ea5e988,transparent 40%),radial-gradient(circle at 50% 100%,#ff3cac66,transparent 45%),#12062b}
.w{max-width:640px;margin:auto}
h1{margin:6px 0 0;text-align:center;font:900 38px/1.1 system-ui;letter-spacing:4px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #a855f788)}
.sub{text-align:center;color:var(--m);margin:4px 0 14px;font-size:13px;letter-spacing:2px}
.card{background:#ffffff12;border:1px solid #ffffff26;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 30px #0005}
h3{margin:0 0 8px}
input,button{font:inherit;border-radius:12px;border:1px solid #ffffff30;padding:11px;width:100%;background:#0003;color:inherit;margin:5px 0;outline:0}
input:focus{border-color:#a855f7;box-shadow:0 0 0 3px #a855f755}
button{background:var(--g);border:0;font-weight:700;cursor:pointer;color:#fff;transition:.15s}button:active{transform:scale(.97)}
button.g{background:#ffffff1f;font-weight:500}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff18}
.row small{color:var(--m);display:block;direction:ltr;text-align:right;overflow:hidden;max-width:58vw;text-overflow:ellipsis;white-space:nowrap}
.sw{width:48px;height:27px;border-radius:14px;background:var(--no);position:relative;flex:none;cursor:pointer;box-shadow:0 0 10px #f43f5e55}
.sw.on{background:linear-gradient(90deg,#22c55e,#22d3ee);box-shadow:0 0 12px #22d3ee66}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{right:24px}
.hide{display:none}#msg{min-height:1.3em;text-align:center;color:#fda4af;font-weight:600}
.code{font:900 34px/1.3 ui-monospace,monospace;letter-spacing:5px;text-align:center;direction:ltr;padding:14px;margin:8px 0;border-radius:14px;background:#0004;border:2px dashed #22d3ee;color:#67e8f9;text-shadow:0 0 14px #22d3ee}
ol{padding-inline-start:20px;color:var(--m);line-height:1.9;margin:6px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:#ffffff1f}
details{color:var(--m)}summary{cursor:pointer;padding:4px}
</style>
<div class="w"><h1>Hammam Bot</h1><div class="sub">CONTROL PANEL</div><div id="msg"></div>
<details class="card"><summary>⚙️ رابط البوت</summary><input id="url" dir="ltr" placeholder="http://IP:PORT"></details>
<div id="out" class="card"><div class="tabs"><button id="tl" onclick="top_('login')">🔐 دخول</button><button id="tk" class="g" onclick="top_('link')">🔗 ربط بوت جديد</button></div>
 <div id="login"><input id="num" placeholder="رقم البوت المربوط (بالمفتاح الدولي)" inputmode="numeric" dir="ltr"><button onclick="req()">أرسل لي الكود ✨</button>
  <div id="s2" class="hide"><input id="code" placeholder="الكود اللي وصلك على واتساب" inputmode="numeric" dir="ltr"><button onclick="ver()">دخول 🚀</button></div></div>
 <div id="link" class="hide"><input id="lnum" placeholder="رقم الواتساب اللي تبي تربطه (9665xxxxxxxx)" inputmode="numeric" dir="ltr"><small id="cnt" style="color:var(--m)"></small><button onclick="lnk()">احصل على كود الربط 🔗</button>
  <div id="lres" class="hide"><div class="code" id="lcode"></div><ol><li>افتح واتساب ← الأجهزة المرتبطة</li><li>اضغط «ربط جهاز» ثم «الربط باستخدام رقم الهاتف»</li><li>اكتب الكود فوق</li></ol></div></div></div>
<div id="app" class="hide">
 <div class="card hide" id="subs"><h3>🤖 البوتات الفرعية <span class="pill" id="sc"></span></h3><div id="sl"></div></div>
 <div class="card"><div class="row"><div><b>حالة البوت</b><small id="who"></small></div><div id="pause" class="sw"></div></div><small style="color:var(--m)">أطفئه مؤقتًا وما يرد على أي أحد، وشغّله وقت ما تبي.</small></div>
 <div class="card"><div class="tabs"><button id="t2" onclick="tab='p2';draw()">🛡️ الحماية</button><button id="t1" class="g" onclick="tab='p1';draw()">⚙️ الأوامر</button></div><input id="q" placeholder="🔎 بحث..." oninput="draw()"><div id="list"></div></div>
 <div class="card"><h3>👑 النواب</h3><div id="deps"></div><input id="dn" placeholder="رقم نائب جديد" inputmode="numeric" dir="ltr"><button onclick="dep(1,$('#dn').value)">إضافة نائب</button></div>
 <button class="g" onclick="exit_()">تسجيل خروج</button></div></div>
<script>
const $=s=>document.querySelector(s),L=localStorage,esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');let S={items:[],deputies:[]},tab='p2',poll
const DEFAULT_URL='http://193.70.34.27:20113' // غيّره لرابط بوتك
$('#url').value=L.url||(/^https?:$/.test(location.protocol)&&!/github\.io$/.test(location.hostname)?location.origin:DEFAULT_URL);$('#num').value=L.num||''
const say=t=>$('#msg').textContent=t||''
function top_(w){for(const k of['login','link'])$('#'+k).classList.toggle('hide',k!=w);$('#tl').className=w=='login'?'':'g';$('#tk').className=w=='link'?'':'g';say()}
async function api(p,b){const u=$('#url').value.trim().replace(/\/$/,'');if(location.protocol=='https:'&&u.startsWith('http:')){say('⚠️ هذي الصفحة https والمتصفح يمنعها تتصل برابط http. افتحها من رابط البوت نفسه أو استخدم رابط https.');return{error:' '}}
 try{const r=await fetch(u+'/panel/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(L.tk||'')},body:b?JSON.stringify(b):undefined})
 if(r.status==401){exit_();return{error:'سجّل دخولك من جديد'}}return await r.json()}catch{return{error:'ما قدرت أتصل بالبوت، تأكد من الرابط'}}}
async function req(){say();L.url=$('#url').value;L.num=$('#num').value;const j=await api('request',{number:$('#num').value});if(j.error)return say(j.error);$('#s2').classList.remove('hide')}
async function ver(){const j=await api('verify',{number:$('#num').value,code:$('#code').value});if(j.error)return say(j.error);L.tk=j.token;load()}
async function lnk(){say();L.url=$('#url').value;const st=await api('status');if(st.error)return say(st.error);const n=$('#lnum').value,sub=st.linked
 const j=await api(sub?'sub-link':'link',{number:n});if(j.error)return say(j.error)
 $('#lcode').textContent=j.code;$('#lres').classList.remove('hide');clearInterval(poll);poll=setInterval(async()=>{const s=sub?await api('sub-status',{number:n}):await api('status');if(s.linked){clearInterval(poll);$('#lres').classList.add('hide');$('#num').value=n;top_('login');say(sub?'✅ تم ربط البوت الفرعي! سجّل دخولك برقمه':'✅ تم الربط! سجّل دخولك الحين')}},4000)}
async function rmsub(n){if(!confirm('حذف البوت الفرعي +'+n+'؟'))return;const j=await api('sub-remove',{number:n});if(j.error)return say(j.error);if(S.sub)exit_();else load()}
function exit_(){L.removeItem('tk');$('#app').classList.add('hide');$('#out').classList.remove('hide')}
async function load(){const j=await api('state');if(j.error)return say(j.error);S=j;$('#out').classList.add('hide');$('#app').classList.remove('hide');say();draw()}
function draw(){$('#pause').className='sw'+(S.paused?'':' on');$('#who').textContent=(S.paused?'⏸️ متوقف مؤقتًا':'✅ شغال')+' — '+(S.sub?'🤖 فرعي +':'')+S.bot;$('#subs').classList.toggle('hide',!S.subs)
 if(S.subs){$('#sc').textContent=S.subs.length+' / '+S.max;$('#sl').innerHTML=S.subs.map(s=>`<div class="row"><span dir="ltr">+${esc(s.number)} <span class="pill">${s.status=='online'?'🟢':'🔴'} ${esc(s.status)}${s.paused?' ⏸️':''}</span></span><button style="width:auto" class="g" onclick="rmsub('${esc(s.number)}')">حذف</button></div>`).join('')||'<small>ما فيه بوتات فرعية بعد</small>'}
 $('#t2').className=tab=='p2'?'':'g';$('#t1').className=tab=='p1'?'':'g';const q=$('#q').value.toLowerCase()
 $('#list').innerHTML=S.items.filter(i=>i.g==tab&&(i.name+i.cmd).toLowerCase().includes(q)).map(i=>`<div class="row"><div>${esc(i.name)}<small>${esc(i.cmd)}</small></div><div class="sw${i.on?' on':''}" data-g="${i.g}" data-f="${esc(i.file)}"></div></div>`).join('')||'<small>ما فيه نتائج</small>'
 $('#deps').innerHTML=S.deputies.map(n=>`<div class="row"><span dir="ltr">${esc(n)}</span>${S.canManage?`<button style="width:auto" class="g" onclick="dep(0,'${esc(n)}')">حذف</button>`:''}</div>`).join('')||'<small>ما فيه نواب</small>'}
$('#list').onclick=async e=>{const el=e.target.closest('.sw');if(!el)return;const it=S.items.find(i=>i.g==el.dataset.g&&i.file==el.dataset.f),on=!it.on;it.on=on;draw()
 const j=await api('toggle',{g:it.g,file:it.file,on});if(j.error){it.on=!on;draw();say(j.error)}}
$('#pause').onclick=async()=>{S.paused=!S.paused;draw();const j=await api('pause',{paused:S.paused});if(j.error){S.paused=!S.paused;draw();say(j.error)}}
async function dep(add,n){const j=await api('deputy',{number:n,add});if(j.error)return say(j.error);$('#dn').value='';load()}
if(L.tk)load();else api('status').then(s=>{if(!s||s.error)return;$('#cnt').textContent=s.linked?`البوتات الفرعية: ${s.subs} / ${s.max}`:'';if(s.linked===false)top_('link')})
</script></html>
